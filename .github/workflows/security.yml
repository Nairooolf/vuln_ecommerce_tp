name: DevSecOps Pipeline - E-commerce

on:
  push:
    branches:
      - secure

jobs:

  # 1. Build Backend
  build-backend:
    name: 🏗 Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t ecommerce-backend:${{ github.sha }} ./backend
      - name: Save backend image
        run: docker save ecommerce-backend:${{ github.sha }} > backend-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

  # 2. Build Frontend
  build-frontend:
    name: 🏗 Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build -t ecommerce-frontend:${{ github.sha }} ./frontend
      - name: Save frontend image
        run: docker save ecommerce-frontend:${{ github.sha }} > frontend-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend-image.tar

  # 3. SAST
  sast:
    name: 🔍 SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: |
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/javascript
            p/react
        continue-on-error: true

  # 4. SCA Backend
  sca-backend:
    name: 📦 SCA Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit backend
        working-directory: ./backend
        run: |
          npm audit --json > audit-backend.json || true
          npm audit || true

  # 5. SCA Frontend
  sca-frontend:
    name: 📦 SCA Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit frontend
        working-directory: ./frontend
        run: |
          npm audit --json > audit-frontend.json || true
          npm audit || true

  # 6. Secrets Scan
  secrets:
    name: 🔑 Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks
        uses: zricethezav/gitleaks-action@v2
        with:
          config-path: ""
        continue-on-error: true

  # 7. Trivy Backend
  container-scan-backend:
    name: 🐳 Container Scan Backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-image
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: backend-image.tar
          severity: HIGH,CRITICAL
          exit-code: 0

  # 8. Trivy Frontend
  container-scan-frontend:
    name: 🐳 Container Scan Frontend
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-image
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          input: frontend-image.tar
          severity: HIGH,CRITICAL
          exit-code: 0

  # 9. Final Report
  report:
    name: 📊 Report
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
      - sast
      - sca-backend
      - sca-frontend
      - secrets
      - container-scan-backend
      - container-scan-frontend
    steps:
      - run: echo "Security Scan Complete - E-commerce App"
