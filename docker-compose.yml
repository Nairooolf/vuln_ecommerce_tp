version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure-backend
    environment:
      NODE_ENV: "production"
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_example_secure}
      SESSION_SECRET: ${SESSION_SECRET:-session_secret_example_secure}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin_api_key_example}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-stripe_key_example}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secure-frontend
    environment:
      REACT_APP_API_BASE_URL: "http://localhost:5001"
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
